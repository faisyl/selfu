{{define "orgs"}}<!DOCTYPE html>
<html lang="en">
<head>
{{template "head" .}}
</head>
<body>
{{template "nav" .}}
<main>

<h2>Organizations</h2>
{{if .Data.Err}}<p class="err">{{.Data.Err}}</p>{{end}}
<form class="inline" onsubmit="apiReload('/api/v1/organizations',{method:'POST',body:{name:this.name.value}});return false">
  <input name="name" placeholder="Organization name" aria-label="Organization name" required>
  <button type="submit">Create</button>
</form>
<table>
<tr><th>Name</th><th>Slug</th><th>Status</th><th></th></tr>
{{range .Data.Orgs}}<tr>
  <td>{{.Name}}</td><td><code>{{.Slug}}</code></td><td>{{.Status}}</td>
  <td><button class="del-org" data-id="{{.ID}}" data-name="{{.Name}}">Delete</button></td>
</tr>{{end}}
</table>

<script>
document.querySelectorAll('.del-org').forEach(b => b.onclick = () => {
  if (confirm('Delete organization "' + b.dataset.name + '"? This cascades its domains, hostnames, mail, apps and members.'))
    apiReload('/api/v1/organizations/' + b.dataset.id, {method:'DELETE'});
});
</script>

</main>
</body>
</html>{{end}}
