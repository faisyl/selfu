{{define "head"}}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>selfu — admin console</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; margin: 0; }
  nav { display: flex; gap: 1rem; align-items: center; padding: .6rem 1rem; border-bottom: 1px solid #8884; background: #0000000a; }
  nav a { text-decoration: none; color: inherit; padding: .25rem .5rem; border-radius: .3rem; }
  nav a.active { background: #0af2; font-weight: 600; }
  nav .spacer { flex: 1; }
  main { padding: 1rem; max-width: 1100px; margin: 0 auto; }
  table { border-collapse: collapse; width: 100%; margin-block: 1rem; }
  th, td { text-align: left; padding: .35rem .6rem; border-bottom: 1px solid #8884; font-size: .95rem; }
  th { border-bottom-width: 2px; }
  input, select, button { padding: .3rem .5rem; margin: .15rem; }
  form.inline { display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; }
  .err { color: #c33; }
  code { background: #00000014; padding: .1rem .3rem; border-radius: .25rem; }
</style>
{{end}}

{{define "nav"}}
<nav>
  <a href="/ui/orgs" class="{{if eq .Data.Active "orgs"}}active{{end}}">Organizations</a>
  <a href="/ui/users" class="{{if eq .Data.Active "users"}}active{{end}}">Users</a>
  <a href="/ui/domains" class="{{if eq .Data.Active "domains"}}active{{end}}">Domains</a>
  <a href="/ui/mail" class="{{if eq .Data.Active "mail"}}active{{end}}">Mail</a>
  <a href="/ui/catalog" class="{{if eq .Data.Active "catalog"}}active{{end}}">Catalog</a>
  <a href="/ui/audit" class="{{if eq .Data.Active "audit"}}active{{end}}">Audit</a>
  <span class="spacer"></span>
  <span>{{.Data.User.Email}}</span>
</nav>
{{end}}
