{{define "head"}}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>selfu — admin console</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; margin: 0; }
  nav { display: flex; gap: 1rem; align-items: center; padding: .6rem 1rem; border-bottom: 1px solid #8884; background: #0000000a; }
  nav a { text-decoration: none; color: inherit; padding: .25rem .5rem; border-radius: .3rem; }
  nav a.active { background: #0af2; font-weight: 600; }
  nav .spacer { flex: 1; }
  main { padding: 1rem; max-width: 1100px; margin: 0 auto; }
  table { border-collapse: collapse; width: 100%; margin-block: 1rem; }
  th, td { text-align: left; padding: .35rem .6rem; border-bottom: 1px solid #8884; font-size: .95rem; }
  th { border-bottom-width: 2px; }
  input, select, button { padding: .3rem .5rem; margin: .15rem; }
  form.inline { display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; }
  .err { color: #c33; }
  code { background: #00000014; padding: .1rem .3rem; border-radius: .25rem; }
  .linklike { background: none; border: none; color: inherit; cursor: pointer; text-decoration: underline; }
</style>
{{end}}

{{define "nav"}}
<nav>
  <a href="/ui/orgs" class="{{if eq .Data.Active "orgs"}}active{{end}}" {{if eq .Data.Active "orgs"}}aria-current="page"{{end}}>Organizations</a>
  <a href="/ui/users" class="{{if eq .Data.Active "users"}}active{{end}}" {{if eq .Data.Active "users"}}aria-current="page"{{end}}>Users</a>
  <a href="/ui/domains" class="{{if eq .Data.Active "domains"}}active{{end}}" {{if eq .Data.Active "domains"}}aria-current="page"{{end}}>Domains</a>
  <a href="/ui/mail" class="{{if eq .Data.Active "mail"}}active{{end}}" {{if eq .Data.Active "mail"}}aria-current="page"{{end}}>Mail</a>
  <a href="/ui/catalog" class="{{if eq .Data.Active "catalog"}}active{{end}}" {{if eq .Data.Active "catalog"}}aria-current="page"{{end}}>Catalog</a>
  <a href="/ui/audit" class="{{if eq .Data.Active "audit"}}active{{end}}" {{if eq .Data.Active "audit"}}aria-current="page"{{end}}>Audit</a>
  <span class="spacer"></span>
  <span>{{.Data.User.Email}}</span>
  <button type="button" class="linklike" onclick="logout()">Logout</button>
</nav>
<script>
/* Shared JSON API helper for every console page: resolves with the parsed
   body, rejects with a human-readable message on non-2xx. */
async function api(url, opts={}){
  const r = await fetch(url, {method:opts.method||'GET', headers:{'Content-Type':'application/json'},
    body: opts.body?JSON.stringify(opts.body):undefined, credentials:'same-origin'});
  const j = await r.json().catch(()=>({}));
  if(!r.ok){ throw (j.error?.message || r.status); }
  return j;
}
function msgOf(e){ return typeof e === 'string' ? e : ((e && e.message) || String(e)); }
/* apiReload: mutate, surface errors, refresh on success. */
async function apiReload(url, opts={}){
  try { await api(url, opts); } catch(e){ alert(msgOf(e)); return; }
  location.reload();
}
</script>
</nav>
{{end}}
