# selfu platform — production compose stack.
# Public edge: Traefik on 80/443 (ACME DNS-01 via Cloudflare). Everything
# else is internal only, on the compose network. SMTP stays directly on
# 25/587 (spec §53 — never through Traefik). No image uses `latest` (§89).
#
# Start with:  cp .env.template .env && make gen-env  (then edit PUBLIC_IP /
#              ACME_EMAIL / hostnames),  docker compose up -d --wait.
name: selfu

services:
  traefik:
    image: traefik:v3.7.10
    restart: unless-stopped
    command:
      - "--providers.file.directory=/etc/traefik"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL:?set in .env}"
      - "--certificatesresolvers.le.acme.storage=/etc/traefik-data/acme.json"
      - "--certificatesresolvers.le.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.le.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
    environment:
      CLOUDFLARE_DNS_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      PLATFORM_HOST: ${PLATFORM_HOST:?set in .env}
      AUTH_HOST: ${AUTH_HOST:?set in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/traefik:/etc/traefik
      - traefik-data:/etc/traefik-data

  db:
    image: postgres:17.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: selfu
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d selfu"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  authentik-server:
    image: ghcr.io/goauthentik/server:2026.5.6
    restart: unless-stopped
    command: ["server"]
    environment: &authentik-env
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?set in .env}
      AUTHENTIK_HOST: https://${AUTH_HOST:?set in .env}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:?set in .env}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:?set in .env}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:?set in .env}
      AUTHENTIK_POSTGRESQL__HOST: db
      AUTHENTIK_POSTGRESQL__USER: ${POSTGRES_USER}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD}
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_LOG_LEVEL: info
      AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
    volumes:
      - ak-media:/media
      - ak-templates:/templates
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.5.6
    restart: unless-stopped
    command: ["worker"]
    environment: *authentik-env
    volumes:
      - ak-media:/media
      - ak-templates:/templates
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  migrate:
    build: .
    restart: "no"
    entrypoint: ["/usr/local/bin/migrate"]
    command: ["up"]
    environment:
      SELFU_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/selfu
    depends_on:
      db:
        condition: service_healthy

  seed:
    build: .
    restart: "no"
    entrypoint: ["/usr/local/bin/seed"]
    environment:
      SELFU_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/selfu
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  authentik-bootstrap:
    build: .
    restart: "no"
    entrypoint: ["/usr/local/bin/authentik-bootstrap"]
    environment:
      AUTHENTIK_BASE_URL: https://${AUTH_HOST}
      AUTHENTIK_TLS_INSECURE: "false"
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN}
      SELFU_OIDC_CLIENT_ID: ${SELFU_OIDC_CLIENT_ID}
      SELFU_OIDC_CLIENT_SECRET: ${SELFU_OIDC_CLIENT_SECRET}
      SELFU_OIDC_REDIRECT_URL: https://${PLATFORM_HOST}/api/v1/auth/callback
      SELFU_OIDC_SLUG: selfu
    extra_hosts:
      - "${AUTH_HOST}:host-gateway"
      - "${PLATFORM_HOST}:host-gateway"
    depends_on:
      authentik-server:
        condition: service_healthy

  chasquid:
    build:
      context: .
      dockerfile: docker/chasquid.Dockerfile
    restart: unless-stopped
    environment:
      CHASQUID_AGENT_TOKEN: ${CHASQUID_AGENT_TOKEN:?set in .env}
      CHASQUID_HOSTNAME: ${MAIL_HOST:-mail.local}
    ports:
      - "25:25"
      - "587:587"
    volumes:
      - chasquid-etc:/etc/chasquid
      - chasquid-data:/data

  worker:
    build: .
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/worker"]
    environment:
      SELFU_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/selfu
      SELFU_SESSION_SECRET: ${SELFU_SESSION_SECRET:?set in .env}
      SELFU_OIDC_CLIENT_ID: ${SELFU_OIDC_CLIENT_ID:?set in .env}
      SELFU_OIDC_CLIENT_SECRET: ${SELFU_OIDC_CLIENT_SECRET:?set in .env}
      SELFU_OIDC_ISSUER: https://${AUTH_HOST}/application/o/selfu/
      SELFU_OIDC_REDIRECT_URL: https://${PLATFORM_HOST}/api/v1/auth/callback
      SELFU_AUTHENTIK_URL: https://${AUTH_HOST}
      SELFU_AUTHENTIK_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN}
      SELFU_CHASQUID_AGENT_URL: http://chasquid:8530
      SELFU_CHASQUID_AGENT_TOKEN: ${CHASQUID_AGENT_TOKEN:-}
      SELFU_RECONCILE_INTERVAL: ${SELFU_RECONCILE_INTERVAL:-30}
      SELFU_OIDC_TLS_INSECURE: "false"
    extra_hosts:
      - "${AUTH_HOST}:host-gateway"
      - "${PLATFORM_HOST}:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      chasquid:
        condition: service_started

  api:
    build: .
    restart: unless-stopped
    environment:
      SELFU_HTTP_ADDR: ":8080"
      SELFU_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/selfu
      SELFU_SESSION_SECRET: ${SELFU_SESSION_SECRET:?set in .env}
      SELFU_SESSION_TTL: "12h"
      SELFU_COOKIE_SECURE: "true"
      SELFU_OIDC_CLIENT_ID: ${SELFU_OIDC_CLIENT_ID:?set in .env}
      SELFU_OIDC_CLIENT_SECRET: ${SELFU_OIDC_CLIENT_SECRET:?set in .env}
      SELFU_OIDC_ISSUER: https://${AUTH_HOST}/application/o/selfu/
      SELFU_OIDC_REDIRECT_URL: https://${PLATFORM_HOST}/api/v1/auth/callback
      SELFU_OIDC_TLS_INSECURE: "false"
      SELFU_AUTHENTIK_URL: https://${AUTH_HOST}
      SELFU_AUTHENTIK_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-admin@selfu.local}
      SELFU_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:?set in .env}
      SELFU_CHASQUID_AGENT_URL: http://chasquid:8530
      SELFU_CHASQUID_AGENT_TOKEN: ${CHASQUID_AGENT_TOKEN:-}
      SELFU_CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      SELFU_CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}
      SELFU_ACCESS_PROVIDER: ${SELFU_ACCESS_PROVIDER:-manual}
      SELFU_LOCAL_DOMAIN: ${SELFU_LOCAL_DOMAIN:-selfu.local}
      SELFU_PUBLIC_IP: ${PUBLIC_IP:-}
      SELFU_DNS_RESOLVERS: ${SELFU_DNS_RESOLVERS:-1.1.1.1:53,8.8.8.8:53}
      SELFU_AFTER_LOGIN_PATH: /
    extra_hosts:
      - "${AUTH_HOST}:host-gateway"
      - "${PLATFORM_HOST}:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
      authentik-bootstrap:
        condition: service_completed_successfully
      traefik:
        condition: service_started

volumes:
  pgdata:
  ak-media:
  ak-templates:
  chasquid-etc:
  chasquid-data:
  traefik-data: